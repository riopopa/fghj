<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Центрированный плеер с большой высотой</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* --- ИЗМЕНЕНИЯ ДЛЯ ЦЕНТРИРОВАНИЯ И ВЫСОТЫ --- */
        html, body {
            margin: 0; 
            padding: 0;
            background-color: #000000;
        }
        
        /* ДОБАВЛЕННЫЙ СТИЛЬ ДЛЯ GIF-КОНТЕЙНЕРА */
        .gif-container {
            width: 90vw; /* Ширина плеера */
            margin-top: 50px; /* Отступ сверху */
            margin-left: auto; 
            margin-right: auto; 
            text-align: center;
        }
        
        .gif-container img {
            width: 100%; /* Занимает всю ширину gif-container (90vw) */
            height: auto;
            display: block; 
            border-radius: 8px; 
            
            /* Удалены все фильтры и классы, которые имитировали статичность. 
               Изображение c.png будет статичным само по себе. */
        }

        .mini-player-container {
            /* Новые требования: */
            width: 90vw; 
            height: 500px; 
            /* Отступ, чтобы отделить от GIF. */
            margin-top: 10px; 
            margin-left: auto; 
            margin-right: auto; 
            
            /* Остальные стили плеера: */
            padding: 15px;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.2);
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #E0E0E0;
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
        }
        
        /* Стили элементов управления плеером (сохранены как в оригинале, но адаптированы под flexbox) */
        
        .current-track-info, .controls, .time-slider-group, hr, .track-search-group {
            flex-shrink: 0; 
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
            color: #FFA500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            flex-grow: 1; 
            justify-content: space-around;
            margin: 0 5px;
        }

        .control-button, #add-file-label, #search-clear-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #E0E0E0;
            transition: color 0.1s, transform 0.1s;
            width: 40px; 
            height: 40px; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            font-size: 24px; 
        }

        #shuffle-btn, #add-file-label {
             font-size: 28px; 
        }
        
        .control-button:hover, #add-file-label:hover, #search-clear-btn:hover {
            color: #FFA500;
            transform: scale(1.1);
        }

        /* Класс, который меняет цвет кнопки при активном перемешивании */
        .control-button.shuffle-active {
            color: #FFD700;
            transform: scale(1.1);
        }

        .time-slider-group {
            margin-bottom: 10px;
        }

        .time-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 4px;
            margin: 10px 0;
            cursor: pointer;
        }
        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFA500;
            cursor: pointer;
        }
        .time-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: #FFA500;
            cursor: pointer;
        }
        hr {
            border: 0;
            border-top: 1px solid #333;
            margin: 10px 0;
        }
        
        /* Изменения для плейлиста */
        .playlist-window {
            height: auto; 
            flex-grow: 1; 
            overflow-y: auto;
            border: 1px solid #333;
            padding: 5px 0;
            background-color: #111;
            font-size: 14px;
            border-radius: 4px;
            min-height: 50px; 
            margin-bottom: 10px; /* Отступ перед поиском */
        }
        
        .playlist-item {
            display: flex;
            padding: 5px 10px;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        
        .playlist-item-number {
            color: #888;
            width: 25px;
            flex-shrink: 0;
            text-align: right;
            margin-right: 8px;
        }
        
        .playlist-item-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }
        .playlist-item:hover {
            background-color: #333;
        }
        
        .playlist-item.active {
             background-color: #FFA500;
             color: #000;
             font-weight: bold;
        }
        #file-input {
            display: none;
        }

        /* --- Стили для поля поиска --- */
        .track-search-group {
            display: flex;
            align-items: center;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #111;
            padding: 5px;
        }

        #track-search-input {
            flex-grow: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: #E0E0E0;
            font-size: 14px;
            outline: none;
        }

        /* Скрытие стандартной кнопки очистки в Chrome/Safari */
        #track-search-input::-webkit-search-cancel-button {
            -webkit-appearance: none;
            appearance: none;
        }
        
        #search-clear-btn {
            font-size: 18px;
            width: 30px;
            height: 30px;
            color: #888;
            padding: 0;
            display: none; /* Сначала скрыто */
        }
        #search-clear-btn:hover {
            color: #FFA500;
            transform: scale(1.05);
        }

    </style>
</head>
<body>
    
    <div class="gif-container">
        <img src="c.png" alt="Изображение над плеером" id="track-image">
    </div>

    <div class="mini-player-container">

        <div class="current-track-info" id="current-track-name">
            Название трека - Исполнитель
        </div>

        <div class="time-slider-group">
            <input type="range" min="0" max="100" value="0" class="time-slider" id="time-slider">
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #888;">
                <span id="current-time">0:00</span>
                <span id="total-time">--:--</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-button" title="Перемешать" id="shuffle-btn">
                <span id="shuffle-icon">🔀</span>
            </button>
            
            <div class="control-group">
                <button class="control-button" title="Предыдущий" id="prev-btn">&#x23EE;&#xFE0F;</button>
                <button class="control-button" title="Воспроизвести/Пауза" id="play-pause-btn">&#x25B6;&#xFE0F;</button>
                <button class="control-button" title="Стоп" id="stop-btn">&#x23F9;&#xFE0F;</button>
                <button class="control-button" title="Следующий" id="next-btn">&#x23ED;&#xFE0F;</button>
            </div>

            <label for="file-input" class="control-button" title="Добавить файлы" id="add-file-label">➕</label>
            <input type="file" id="file-input" accept="audio/*" multiple>
        </div>

        <hr>

        <div class="playlist-window" id="playlist-window">
            <div style="text-align: center; padding: 10px; color: #888;">Плейлист пуст. Добавьте файлы!</div>
        </div>

        <div class="track-search-group">
            <input type="search" id="track-search-input" placeholder="Поиск по названию или номеру...">
            <button id="search-clear-btn" title="Очистить поиск">✕</button>
        </div>
        </div>

    <audio id="audio-player" style="display: none;"></audio>

    <script>
        // *** ИСПРАВЛЕННЫЙ КОД ДЛЯ ИНИЦИАЛИЗАЦИИ TELEGRAM WEBAPP ***
        if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            
            // Расширение WebApp до максимальной высоты, но с высотой 2000px будет скролл
            Telegram.WebApp.expand(); 
        }
        
        // --- Старый код плеера (только JS) ---

        const audioPlayer = document.getElementById('audio-player');
        const playlistWindow = document.getElementById('playlist-window');
        const fileInput = document.getElementById('file-input');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const shuffleIcon = document.getElementById('shuffle-icon');
        const currentTrackNameDisplay = document.getElementById('current-track-name');
        const timeSlider = document.getElementById('time-slider');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');
        
        // Элементы поиска 
        const searchInput = document.getElementById('track-search-input');
        const searchClearBtn = document.getElementById('search-clear-btn');
        
        // Элемент изображения (ИЗМЕНЕНО)
        const trackImage = document.getElementById('track-image'); 
        
        // Константы для путей к изображениям (ДОБАВЛЕНО)
        const GIF_SRC = "c.gif";
        const PNG_SRC = "c.png";

        let originalPlaylist = []; 
        let currentPlaylist = [];   
        let currentTrackIndex = -1; 
        let isShuffling = false;
        let isSeeking = false;
        
        let playbackOrder = []; 
        let currentPlaybackIndex = -1; 

        // --- НОВАЯ ФУНКЦИЯ ДЛЯ УПРАВЛЕНИЯ ИЗОБРАЖЕНИЕМ (ИЗМЕНЕНО) ---
        function setTrackImage(isPlaying) {
            if (isPlaying) {
                // Если играет, ставим GIF и добавляем случайный параметр, чтобы запустить анимацию с начала
                trackImage.src = GIF_SRC + '?' + Date.now();
            } else {
                // Если не играет, ставим PNG (статичное изображение)
                trackImage.src = PNG_SRC;
            }
        }
        // ----------------------------------------------------

        // --- Вспомогательные функции ---

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function scrollToActiveTrack() {
            const activeTrack = document.querySelector('.playlist-item.active');
            if (activeTrack) {
                activeTrack.scrollIntoView({
                    behavior: 'smooth', 
                    block: 'center'   
                });
            }
        }

        // --- Функции управления плеером (ОБНОВЛЕНЫ для работы с ID и оригинальным индексом) ---

        function updateTrackDisplay() {
            if (currentTrackIndex >= 0 && currentPlaylist.length > 0) {
                const track = currentPlaylist[currentTrackIndex];
                currentTrackNameDisplay.textContent = `${track.name}`;
            } else {
                currentTrackNameDisplay.textContent = 'Название трека - Исполнитель';
            }

            const playingTrackId = currentTrackIndex !== -1 ? currentPlaylist[currentTrackIndex].id : null;
            
            document.querySelectorAll('.playlist-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id == playingTrackId);
            });
            
            scrollToActiveTrack();
        }
        
        function playTrack(index) {
            if (index >= 0 && index < currentPlaylist.length) {
                const trackToPlay = currentPlaylist[index]; // Трек из отфильтрованного списка
                const originalIndex = originalPlaylist.findIndex(t => t.id === trackToPlay.id); // Его индекс в оригинальном списке
                
                if (originalIndex === -1) return; 

                currentTrackIndex = index; // Индекс в текущем (отфильтрованном) списке
                
                audioPlayer.src = URL.createObjectURL(trackToPlay.file);
                audioPlayer.play();
                playPauseBtn.innerHTML = '&#x23F8;&#xFE0F;';
                
                // Включаем GIF
                setTrackImage(true);
                
                // Обновляем currentPlaybackIndex для корректной работы playNext/playPrev
                if (isShuffling) {
                    currentPlaybackIndex = playbackOrder.indexOf(originalIndex);
                    if (currentPlaybackIndex === -1) {
                         // Если трек не был в порядке воспроизведения (например, добавлен или не найден)
                         buildPlaybackOrder(); 
                         currentPlaybackIndex = playbackOrder.indexOf(originalIndex);
                    }
                } else {
                    currentPlaybackIndex = originalIndex;
                }
                
                updateTrackDisplay(); 
            } else {
                currentTrackIndex = -1;
                currentPlaybackIndex = -1;
                audioPlayer.src = '';
                playPauseBtn.innerHTML = '&#x25B6;&#xFE0F;';
                
                // Выключаем GIF, ставим PNG
                setTrackImage(false);
                
                updateTrackDisplay();
            }
        }
        
        function togglePlayPause() {
            if (audioPlayer.paused) {
                if (currentTrackIndex === -1 && currentPlaylist.length > 0) {
                    // Если ничего не играет, но плейлист (отфильтрованный) не пуст
                    if (isShuffling && playbackOrder.length > 0) {
                        // Начинаем с первого трека в порядке шаффла
                        const firstTrackInOrder = originalPlaylist[playbackOrder[0]];
                        const filteredIndex = currentPlaylist.findIndex(t => t.id === firstTrackInOrder.id);
                        
                        if (filteredIndex !== -1) {
                             playTrack(filteredIndex);
                        } else {
                             // Если первый трек шаффла не прошел фильтр, берем первый отфильтрованный
                             playTrack(0);
                        }
                    } else {
                        playTrack(0); 
                    }
                } else if (currentTrackIndex !== -1) {
                    audioPlayer.play();
                    playPauseBtn.innerHTML = '&#x23F8;&#xFE0F;';
                    // Включаем GIF
                    setTrackImage(true);
                }
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '&#x25B6;&#xFE0F;';
                // Выключаем GIF, ставим PNG
                setTrackImage(false);
            }
        }

        function stopPlayback() {
             audioPlayer.pause();
             audioPlayer.currentTime = 0;
             playPauseBtn.innerHTML = '&#x25B6;&#xFE0F;';
             timeSlider.value = 0;
             currentTimeDisplay.textContent = '0:00';
             // Выключаем GIF, ставим PNG
             setTrackImage(false);
             updateTrackDisplay(); 
        }

        function playNext() {
            if (originalPlaylist.length === 0 || currentPlaylist.length === 0) return;
            
            let nextTrackId;

            if (isShuffling) {
                // Идем по playbackOrder (индексы оригинального списка)
                let nextPlaybackIndex = (currentPlaybackIndex + 1) % playbackOrder.length;
                
                // Трек, который должен быть следующим по шаффлу
                const trackToPlay = originalPlaylist[playbackOrder[nextPlaybackIndex]];
                nextTrackId = trackToPlay.id;
            } else {
                // Идем по currentPlaylist (отфильтрованный список)
                const nextTrackIndexInCurrent = (currentTrackIndex + 1) % currentPlaylist.length;
                const trackToPlay = currentPlaylist[nextTrackIndexInCurrent];
                nextTrackId = trackToPlay.id;
            }

            // Находим индекс трека в текущем (отфильтрованном) плейлисте
            const nextTrackIndex = currentPlaylist.findIndex(t => t.id === nextTrackId);

            if (nextTrackIndex !== -1) {
                playTrack(nextTrackIndex);
            } else {
                 // Если следующий трек в шаффле не прошел фильтр, или произошла ошибка,
                 // переходим на первый трек в отфильтрованном списке
                 playTrack(0);
            }
        }

        function playPrev() {
            if (originalPlaylist.length === 0 || currentPlaylist.length === 0) return;
            
            let prevTrackId;
            
            if (isShuffling) {
                // Идем по playbackOrder (индексы оригинального списка)
                let prevPlaybackIndex = currentPlaybackIndex - 1;
                if (prevPlaybackIndex < 0) {
                    prevPlaybackIndex = playbackOrder.length - 1;
                }
                
                const trackToPlay = originalPlaylist[playbackOrder[prevPlaybackIndex]];
                prevTrackId = trackToPlay.id;
            } else {
                // Идем по currentPlaylist (отфильтрованный список)
                let prevIndexInCurrent = currentTrackIndex - 1;
                if (prevIndexInCurrent < 0) {
                    prevIndexInCurrent = currentPlaylist.length - 1;
                }
                const trackToPlay = currentPlaylist[prevIndexInCurrent];
                prevTrackId = trackToPlay.id;
            }

            // Находим индекс трека в текущем (отфильтрованном) плейлисте
            const prevTrackIndex = currentPlaylist.findIndex(t => t.id === prevTrackId);

            if (prevTrackIndex !== -1) {
                playTrack(prevTrackIndex);
            } else {
                 // Если предыдущий трек в шаффле не прошел фильтр, или произошла ошибка,
                 // переходим на последний трек в отфильтрованном списке
                 playTrack(currentPlaylist.length - 1);
            }
        }

        // --- Функции плейлиста ---

        function buildPlaybackOrder() {
            const indices = originalPlaylist.map((_, i) => i);
            
            if (isShuffling) {
                playbackOrder = shuffleArray(indices);
                
                // Если что-то играет, ставим его в начало порядка воспроизведения
                if (currentTrackIndex !== -1) {
                    const currentTrackId = currentPlaylist[currentTrackIndex].id;
                    const originalIndex = originalPlaylist.findIndex(t => t.id === currentTrackId);

                    const oldIndexInOrder = playbackOrder.indexOf(originalIndex);
                    
                    if (oldIndexInOrder > 0) {
                        playbackOrder.splice(oldIndexInOrder, 1);
                        playbackOrder.unshift(originalIndex);
                    }
                    currentPlaybackIndex = 0;
                } else {
                    currentPlaybackIndex = -1;
                }
            } else {
                playbackOrder = indices;
                if (currentTrackIndex !== -1) {
                    const currentTrackId = currentPlaylist[currentTrackIndex].id;
                    currentPlaybackIndex = originalPlaylist.findIndex(t => t.id === currentTrackId);
                } else {
                     currentPlaybackIndex = -1;
                }
            }
        }

        function toggleShuffle() {
            isShuffling = !isShuffling;
            shuffleBtn.classList.toggle('shuffle-active', isShuffling);
            
            // ЛОГИКА СМЕНЫ ИКОНКИ
            shuffleIcon.innerHTML = isShuffling ? '🔁' : '🔀';
            
            buildPlaybackOrder();
            
            if (isShuffling && currentTrackIndex === -1 && currentPlaylist.length > 0) {
                 // Если включаем шаффл и ничего не играет, начинаем с первого в шаффле
                 const trackId = originalPlaylist[playbackOrder[0]].id;
                 const filteredIndex = currentPlaylist.findIndex(t => t.id === trackId);
                 if (filteredIndex !== -1) {
                     playTrack(filteredIndex);
                 } else if (currentPlaylist.length > 0) {
                     playTrack(0); // Или первый отфильтрованный, если шаффл-трек не прошел фильтр
                 }
            }
        }

        function renderPlaylist() {
            playlistWindow.innerHTML = '';
            
            const searchTerm = searchInput.value.toLowerCase().trim();
            const currentTrackId = currentTrackIndex !== -1 ? currentPlaylist[currentTrackIndex].id : null;

            if (currentPlaylist.length === 0) {
                const message = searchTerm 
                    ? 'Треки не найдены.' 
                    : 'Плейлист пуст. Добавьте файлы!';
                    
                playlistWindow.innerHTML = `<div style="text-align: center; padding: 10px; color: #888;">${message}</div>`;
                return;
            }
            
            currentPlaylist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.addEventListener('click', () => playTrack(index));
                
                // Ищем оригинальный индекс, чтобы отобразить правильный порядковый номер
                const originalIndex = originalPlaylist.findIndex(t => t.id === track.id);
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'playlist-item-number';
                numberSpan.textContent = `${originalIndex !== -1 ? originalIndex + 1 : index + 1}.`; // Показываем оригинальный номер
                item.appendChild(numberSpan);

                const nameSpan = document.createElement('span');
                nameSpan.className = 'playlist-item-name';
                nameSpan.textContent = track.name;
                item.appendChild(nameSpan);
                
                item.dataset.id = track.id; 
                
                // Выделяем, если трек активен
                if (track.id === currentTrackId) {
                    item.classList.add('active');
                }

                playlistWindow.appendChild(item);
            });
            
            scrollToActiveTrack(); 
        }
        
        // ФУНКЦИЯ ФИЛЬТРАЦИИ (ДОБАВЛЕНО)
        function filterPlaylist(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            const num = parseInt(searchTerm.trim(), 10);
            
            searchClearBtn.style.display = term ? 'flex' : 'none';

            if (term) {
                let filtered = [];

                // 1. Поиск по порядковому номеру (если введенный текст - это число)
                if (!isNaN(num) && num >= 1 && num <= originalPlaylist.length) {
                    // Номер в плейлисте = индекс + 1
                    filtered = [originalPlaylist[num - 1]];
                } 
                
                // 2. Поиск по названию (если по номеру не найдено или число не введено)
                if (filtered.length === 0) {
                    currentPlaylist = originalPlaylist.filter(track => 
                        track.name.toLowerCase().includes(term)
                    );
                } else {
                    currentPlaylist = filtered;
                }

            } else {
                // Если поиск пуст, currentPlaylist - это полный originalPlaylist
                currentPlaylist = [...originalPlaylist];
            }
            
            // Проверяем, остался ли текущий трек в отфильтрованном списке
            if (currentTrackIndex !== -1) {
                const playingTrackId = currentPlaylist[currentTrackIndex] ? currentPlaylist[currentTrackIndex].id : null;
                const trackStillInFilter = currentPlaylist.some(t => t.id === playingTrackId);
                
                if (!trackStillInFilter) {
                    // Если трек не прошел фильтр
                    audioPlayer.pause();
                    playPauseBtn.innerHTML = '&#x25B6;&#xFE0F;';
                    currentTrackIndex = -1; 
                    
                    // Выключаем GIF, ставим PNG
                    setTrackImage(false);
                } else {
                    // Обновляем currentTrackIndex, чтобы он указывал на правильный индекс в currentPlaylist
                    currentTrackIndex = currentPlaylist.findIndex(t => t.id === playingTrackId);
                }
            } else if (currentPlaylist.length === 1 && currentTrackIndex === -1) {
                 // Если найден один трек по номеру/названию и ничего не играло, начинаем воспроизведение
                 playTrack(0);
            }
            
            renderPlaylist();
        }

        function addFilesToPlaylist(files) {
            Array.from(files).forEach((file) => {
                const name = file.name.replace(/\.[^/.]+$/, "");
                const newTrack = {
                    id: Date.now() + Math.random(), 
                    name: name,
                    file: file
                };
                originalPlaylist.push(newTrack);
            });
            
            filterPlaylist(searchInput.value); // Применяем фильтр к новому списку
            buildPlaybackOrder();

            if (currentTrackIndex === -1 && currentPlaylist.length > 0) {
                 // Начинаем проигрывание с первого трека, если ничего не играет
                 if (isShuffling && playbackOrder.length > 0) {
                     const trackId = originalPlaylist[playbackOrder[0]].id;
                     const filteredIndex = currentPlaylist.findIndex(t => t.id === trackId);
                     if (filteredIndex !== -1) {
                         playTrack(filteredIndex);
                     } else if (currentPlaylist.length > 0) {
                         playTrack(0);
                     }
                 } else {
                     playTrack(0);
                 }
            }
        }

        // --- Обработчики событий ---
        
        document.getElementById('file-input').addEventListener('change', (event) => {
            if (event.target.files.length > 0) {
                addFilesToPlaylist(event.target.files);
                event.target.value = null;
            }
        });

        document.getElementById('play-pause-btn').addEventListener('click', togglePlayPause);
        document.getElementById('prev-btn').addEventListener('click', playPrev);
        document.getElementById('next-btn').addEventListener('click', playNext);
        document.getElementById('stop-btn').addEventListener('click', stopPlayback);
        shuffleBtn.addEventListener('click', toggleShuffle);

        audioPlayer.addEventListener('timeupdate', () => {
            if (!isNaN(audioPlayer.duration) && !isSeeking) {
                const percentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                timeSlider.value = percentage;
                currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            if (!isNaN(audioPlayer.duration)) {
                totalTimeDisplay.textContent = formatTime(audioPlayer.duration);
            }
        });
        
        // Управление GIF/PNG при Play/Pause (ДОБАВЛЕНО)
        audioPlayer.addEventListener('play', () => {
            setTrackImage(true);
        });
        audioPlayer.addEventListener('pause', () => {
             // Проверяем, что пауза не вызвана концом трека или началом другого
             if (audioPlayer.currentTime > 0) { 
                 setTrackImage(false);
             }
        });

        timeSlider.addEventListener('mousedown', () => { isSeeking = true; });
        timeSlider.addEventListener('touchstart', () => { isSeeking = true; });

        timeSlider.addEventListener('input', () => {
            if (!isNaN(audioPlayer.duration)) {
                const time = (timeSlider.value / 100) * audioPlayer.duration;
                currentTimeDisplay.textContent = formatTime(time);
            }
        });

        timeSlider.addEventListener('mouseup', () => {
            if (!isNaN(audioPlayer.duration)) {
                const time = (timeSlider.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = time;
            }
            isSeeking = false;
        });
        timeSlider.addEventListener('touchend', () => {
            if (!isNaN(audioPlayer.duration)) {
                const time = (timeSlider.value / 100) * audioPlayer.duration;
                audioPlayer.currentTime = time;
            }
            isSeeking = false;
        });

        audioPlayer.addEventListener('ended', playNext);
        
        // --- Обработчики для поиска (ДОБАВЛЕНО) ---
        searchInput.addEventListener('input', (event) => {
            filterPlaylist(event.target.value);
        });

        searchClearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterPlaylist('');
            searchInput.focus();
        });


        // Инициализация
        filterPlaylist(''); // Изначально отображаем весь плейлист
    </script>
</body>
</html>
