<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winamp-подобный Аудиоплеер (Мини-приложение)</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ИЗМЕНЕНИЯ ДЛЯ РАСТЯГИВАНИЯ НА ЭКРАН */
        body {
            font-family: Arial, sans-serif;
            /* УДАЛЕН min-height: 100vh; */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #222; 
            margin: 0;
            padding: 10px; 
            box-sizing: border-box; 
        }

        .audio-player-container {
            padding: 5px;
            border: 1px solid #000;
            background-color: #333; 
            color: #00ff00; 
            width: 100%; 
            max-width: 900px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            border-radius: 0; 
            border-top: 3px solid #666; 
            border-bottom: 3px solid #111; 
            /* ОГРАНИЧИВАЕМ МАКСИМАЛЬНУЮ ВЫСОТУ КОНТЕЙНЕРА В СТИЛЯХ */
            max-height: 95vh; 
            overflow-y: auto;
        }
        
        h1 {
            display: none; 
        }

        h2 {
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
            margin-bottom: 5px;
            border-bottom: 1px dashed #666;
            padding-bottom: 3px;
        }
        
        #folder-input {
            display: none;
        }
        
        /* --- НОВЫЙ БЛОК: СКОРОСТЬ и ГРОМКОСТЬ --- */
        #top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            background-color: #444;
            border-bottom: 1px solid #555;
            margin-bottom: 5px;
        }

        .control-group {
            display: flex;
            align-items: center;
            font-size: 12px;
            gap: 5px;
            color: #ccc;
        }
        
        /* Стилизация ползунков (Speed/Volume) */
        .control-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #555;
            cursor: pointer;
            width: 80px; 
            margin: 0 5px;
        }

        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00; 
            border: 1px solid #000;
        }

        .control-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00; 
            border: 1px solid #000;
        }
        
        /* --- КОНЕЦ НОВОГО БЛОКА --- */

        /* --- Стили для Шкалы Времени и Дисплея --- */
        #playback-display {
            display: flex;
            align-items: center;
            padding: 5px 0;
        }

        #time-indicator {
            font-size: 12px;
            color: #00ff00; 
            padding-right: 5px;
            flex-shrink: 0;
        }

        #seek-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px; 
            background: #555;
            margin: 0;
            cursor: pointer;
        }

        /* Ползунок (Chromium/Webkit) */
        #seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00; 
            border: 1px solid #000;
        }

        /* Ползунок (Firefox) */
        #seek-bar::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00; 
            border: 1px solid #000;
        }
        /* --- Конец Стили для Шкалы Времени и Дисплея --- */

        /* --- Стили для Кастомных Кнопок Контроля --- */
        #custom-controls {
            display: flex;
            justify-content: space-between; 
            align-items: center; 
            margin-top: 10px;
            padding: 5px 10px; 
            background-color: #444; 
            border-top: 1px solid #555;
            border-bottom: 1px solid #222;
        }

        #control-buttons-group {
            display: flex;
            gap: 10px; 
        }
        
        .control-button {
            background: none;
            border: 1px solid transparent;
            color: #00ff00; 
            text-shadow: 0 0 5px #00ff00; 
            font-size: 20px;
            cursor: pointer;
            padding: 2px 5px;
            transition: background-color 0.1s;
        }

        .control-button:hover {
            background-color: #555;
            border-color: #777;
        }
        
        #add-files-button {
            background: none;
            border: 1px solid #444;
            padding: 3px 5px;
            font-size: 18px;
            cursor: pointer;
            color: #00ff00; 
            text-shadow: 0 0 5px #00ff00; 
            transition: background-color 0.1s;
        }
        
        #add-files-button:hover {
            background-color: #555;
            border-color: #00ff00;
        }
        
        #audio-player {
            display: none; 
        }
        /* --- Конец Стили для Кастомных Кнопок Контроля --- */


        /* Стили для кнопки Shuffle */
        #controls-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px; 
            margin-bottom: 5px;
        }

        #shuffle-button {
            background-color: #555;
            color: #fff;
            border: 1px solid #777;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
            margin-left: 10px;
            transition: background-color 0.1s;
        }

        #shuffle-button:hover {
            background-color: #777;
        }

        #shuffle-button.active {
            background-color: #00ff00; 
            color: #000;
            border-color: #00ff00;
            font-weight: bold;
        }

        /* Стили для Плейлиста */
        #playlist {
            list-style: none;
            padding: 0;
            margin-top: 5px;
            border: 1px solid #222; 
            background-color: #222; 
            /* ОГРАНИЧЕНИЕ ВЫСОТЫ КОНТЕНТА */
            height: 30vh; 
            max-height: 300px; 
            overflow-y: auto; 
            font-size: 12px;
            margin-bottom: 5px; 
        }
        
        /* Стилизация полосы прокрутки (только для Webkit) */
        #playlist::-webkit-scrollbar {
            width: 8px;
        }
        #playlist::-webkit-scrollbar-track {
            background: #111; 
        }
        #playlist::-webkit-scrollbar-thumb {
            background: #555; 
        }
        #playlist::-webkit-scrollbar-thumb:hover {
            background: #888; 
        }

        /* ИЗМЕНЕНИЕ: Отступы для нумерации */
        #playlist li {
            padding: 3px 5px;
            cursor: pointer;
            color: #fff; 
            border-bottom: 1px dashed #444;
            display: flex; 
            gap: 10px;
        }
        
        /* Стиль для номера трека */
        .track-number {
            color: #777; 
            flex-shrink: 0;
            width: 20px; 
            text-align: right;
        }
        
        /* Стиль для имени трека */
        .track-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #playlist li:last-child {
            border-bottom: none;
        }

        #playlist li:hover {
            background-color: #555; 
            color: #00ff00;
        }
        
        /* Выделение текущего трека - как в Winamp (инверсия) */
        #playlist li[data-playing="true"] {
            font-weight: bold;
            background-color: #00ff00 !important; 
            color: #000 !important; 
        }

        /* Стили для Поиска */
        #playlist-search {
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            background-color: #222; 
            color: #00ff00; 
            border: 1px solid #000;
            font-size: 12px;
            margin-top: 5px;
        }
        
        #playlist-search:focus {
            outline: none;
            border-color: #00ff00;
        }
    </style>
</head>
<body>

    <div class="audio-player-container">
        <h1>Аудиоплеер</h1>
        
        <audio id="audio-player"></audio>
        
        <div id="top-controls">
            <div class="control-group">
                <span>Скорость:</span>
                <input type="range" id="playback-speed" class="control-slider" min="0.5" max="2.0" value="1.0" step="0.25">
                <span id="speed-value">1.0x</span>
            </div>
            
            <div class="control-group">
                <span>Громкость:</span>
                <input type="range" id="volume-control" class="control-slider" min="0" max="1" value="1" step="0.01">
                <span id="volume-value">100%</span>
            </div>
        </div>
        <div id="playback-display">
            <div id="time-indicator">0:00 / 0:00</div>
            <input type="range" id="seek-bar" value="0" min="0" max="100">
        </div>

        <div id="custom-controls">
            <div id="control-buttons-group">
                <button class="control-button" id="prev-track">⏮️</button>
                <button class="control-button" id="play-track">▶️</button>
                <button class="control-button" id="pause-track">⏸️</button> 
                <button class="control-button" id="stop-track">⏹️</button>
                <button class="control-button" id="next-track">⏭️</button>
            </div>
            
            <button id="add-files-button">➕</button>
        </div>


        <input 
            type="file" 
            id="folder-input" 
            accept="audio/mp3, audio/mpeg" 
            multiple
            webkitdirectory 
            directory 
            onchange="loadPlaylist(this.files)"
        >


        <div id="controls-group">
            <h2>Плейлист</h2>
            <button id="shuffle-button">Случайно</button>
        </div>

        <ul id="playlist">
            <li><span class="track-number"></span><span class="track-name">(Файлы появятся здесь после выбора)</span></li>
        </ul>
        
        <input 
            type="text" 
            id="playlist-search" 
            placeholder="Поиск по плейлисту..." 
            onkeyup="filterPlaylist(this.value)"
        >
        
    </div>

    <script>
        // КЛЮЧЕВОЙ ШАГ 2: Установка высоты приложения
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            // Сообщаем Telegram, что приложение готово
            tg.ready();

            // Функция для установки половины высоты
            const setHalfHeight = () => {
                // Если приложение уже развернуто на весь экран, 
                // можно пропустить попытку уменьшения, но setViewportSettings 
                // должен работать для ограничения.
                
                // Рассчитываем половину доступной высоты
                const halfScreenHeight = Math.round(tg.viewportHeight / 2);
                
                // Устанавливаем максимальную высоту.
                // Telegram использует эту высоту для первоначального открытия.
                tg.setViewportSettings({ 
                    max_height: halfScreenHeight
                }, (err) => {
                    if (err) console.error("Ошибка установки высоты WebApp:", err);
                });
            };

            // Вызываем при загрузке
            setHalfHeight();
            
            // Опционально: вызываем при изменении размеров экрана (например, поворот телефона)
            tg.onEvent('viewportChanged', setHalfHeight);
            
            // Убедитесь, что вы НЕ вызываете tg.expand() нигде в коде!
        }
        // ------------------------------------------------------------------


        const audioPlayer = document.getElementById('audio-player');
        const playlist = document.getElementById('playlist');
        const shuffleButton = document.getElementById('shuffle-button');
        const searchInput = document.getElementById('playlist-search');
        
        const playButton = document.getElementById('play-track'); 
        const pauseButton = document.getElementById('pause-track'); 
        const stopButton = document.getElementById('stop-track');
        const prevButton = document.getElementById('prev-track');
        const nextButton = document.getElementById('next-track');
        const addFilesButton = document.getElementById('add-files-button'); 
        
        const seekBar = document.getElementById('seek-bar');
        const timeIndicator = document.getElementById('time-indicator');
        
        const speedControl = document.getElementById('playback-speed');
        const speedValue = document.getElementById('speed-value');
        const volumeControl = document.getElementById('volume-control');
        const volumeValue = document.getElementById('volume-value');
        
        const folderInput = document.getElementById('folder-input');
        
        let isShuffling = false;
        let allTrackItems = []; 
        let isSeeking = false; 

        // Инициализация громкости и скорости
        audioPlayer.volume = parseFloat(volumeControl.value);
        audioPlayer.playbackRate = parseFloat(speedControl.value);


        // --- ФУНКЦИИ ФОРМАТИРОВАНИЯ ---

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }


        // --- ФУНКЦИИ УПРАВЛЕНИЯ ПЛЕЕРОМ ---

        function highlightTrack(listItem) {
            Array.from(playlist.children).forEach(li => li.removeAttribute('data-playing'));
            
            if (listItem) {
                listItem.setAttribute('data-playing', 'true');
                listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function playTrack(listItem) {
            if (!listItem) return;

            audioPlayer.src = listItem.dataset.url;
            seekBar.value = 0; 
            timeIndicator.textContent = '0:00 / 0:00';
            
            audioPlayer.play();
            highlightTrack(listItem);
        }

        function playPreviousTrack() {
            const visibleTracks = Array.from(playlist.children).filter(li => li.style.display !== 'none');
            const currentTrack = visibleTracks.find(li => li.getAttribute('data-playing') === 'true');
            
            if (!currentTrack || visibleTracks.length === 0) return;

            const tracks = visibleTracks;
            const currentIndex = tracks.indexOf(currentTrack);
            let prevTrack;

            if (isShuffling) {
                let prevIndex;
                do {
                    prevIndex = Math.floor(Math.random() * tracks.length);
                } while (prevIndex === currentIndex);
                prevTrack = tracks[prevIndex];
            } else {
                let prevIndex = currentIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = tracks.length - 1;
                }
                prevTrack = tracks[prevIndex];
            }

            if (prevTrack) {
                playTrack(prevTrack);
            }
        }


        function playNextTrack() {
            const visibleTracks = Array.from(playlist.children).filter(li => li.style.display !== 'none');
            const currentTrack = visibleTracks.find(li => li.getAttribute('data-playing') === 'true');
            
            if (!currentTrack || visibleTracks.length === 0) {
                if (visibleTracks.length > 0) {
                    playTrack(visibleTracks[0]);
                }
                return;
            }

            let nextTrack;
            const tracks = visibleTracks;

            if (isShuffling) {
                const currentIndex = tracks.indexOf(currentTrack);
                let nextIndex;

                if (tracks.length <= 1) return; 

                do {
                    nextIndex = Math.floor(Math.random() * tracks.length);
                } while (nextIndex === currentIndex);

                nextTrack = tracks[nextIndex];

            } else {
                const currentIndex = tracks.indexOf(currentTrack);
                let nextIndex = currentIndex + 1;
                
                if (nextIndex >= tracks.length) {
                    nextIndex = 0;
                }
                nextTrack = tracks[nextIndex];
            }

            if (nextTrack) {
                playTrack(nextTrack);
            }
        }

        // --- ФУНКЦИЯ ПОИСКА ---
        function filterPlaylist(searchTerm) {
            const term = searchTerm.toLowerCase().trim();

            allTrackItems.forEach(listItem => {
                const trackNameElement = listItem.querySelector('.track-name');
                const trackNumberElement = listItem.querySelector('.track-number');

                if (!trackNameElement) return;

                const trackName = trackNameElement.textContent.toLowerCase();
                
                if (trackName.includes(term)) {
                    listItem.style.display = 'flex'; 
                } else {
                    listItem.style.display = 'none'; 
                }
            });
            
            const currentTrack = document.querySelector('#playlist li[data-playing="true"]');
            if (currentTrack && currentTrack.style.display === 'none') {
                // Ничего не делаем, если играющий трек скрыт поиском
            }
        }
        
        // --- ОБРАБОТЧИКИ СОБЫТИЙ ---
        
        // КЛЮЧЕВОЙ ОБРАБОТЧИК ДЛЯ СБРОСА INPUT VALUE
        addFilesButton.addEventListener('click', function() {
            // Перед открытием диалога сбрасываем значение input
            folderInput.value = null; 
            folderInput.click();
        });


        function loadPlaylist(files) {
            playlist.innerHTML = '';
            allTrackItems = [];
            
            if (files.length === 0) {
                playlist.innerHTML = '<li><span class="track-number"></span><span class="track-name">(Нет выбранных файлов)</span></li>';
                audioPlayer.src = '';
                return;
            }

            // Находим все аудиофайлы
            const audioFiles = Array.from(files).filter(file => file.type.startsWith('audio/'));

            if (audioFiles.length === 0) {
                 playlist.innerHTML = '<li><span class="track-number"></span><span class="track-name">(Нет аудиофайлов в папке)</span></li>';
                 audioPlayer.src = '';
                 return;
            }

            audioFiles.forEach((file, index) => {
                const listItem = document.createElement('li');
                
                // Добавляем нумерацию и имя трека
                listItem.innerHTML = `<span class="track-number">${index + 1}.</span><span class="track-name">${file.name}</span>`;
                listItem.dataset.url = URL.createObjectURL(file); 
                
                listItem.addEventListener('click', function() {
                    playTrack(this);
                });

                playlist.appendChild(listItem);
                allTrackItems.push(listItem); 
            });
            
            if (playlist.children.length > 0) {
                playTrack(playlist.children[0]);
            }
            searchInput.value = '';
        }
        
        // Автоматическое воспроизведение следующего трека
        audioPlayer.addEventListener('ended', playNextTrack);
        
        // Событие, когда браузер может определить длительность трека
        audioPlayer.addEventListener('loadedmetadata', () => {
            seekBar.max = audioPlayer.duration;
            timeIndicator.textContent = `0:00 / ${formatTime(audioPlayer.duration)}`;
        });
        
        // Обновление шкалы и времени во время воспроизведения
        audioPlayer.addEventListener('timeupdate', () => {
            if (!isSeeking) {
                seekBar.value = audioPlayer.currentTime;
                timeIndicator.textContent = `${formatTime(audioPlayer.currentTime)} / ${formatTime(audioPlayer.duration)}`;
            }
        });

        // Начало перетаскивания ползунка
        seekBar.addEventListener('mousedown', () => {
            isSeeking = true;
        });
        seekBar.addEventListener('touchstart', () => {
            isSeeking = true;
        });

        // Завершение перетаскивания ползунка и перемотка
        seekBar.addEventListener('mouseup', () => {
            isSeeking = false;
            audioPlayer.currentTime = seekBar.value;
        });
        seekBar.addEventListener('touchend', () => {
            isSeeking = false;
            audioPlayer.currentTime = seekBar.value;
        });
        
        // Обновление времени, пока ползунок перетаскивается (для отображения)
        seekBar.addEventListener('input', () => {
            if (isSeeking) {
                timeIndicator.textContent = `${formatTime(seekBar.value)} / ${formatTime(audioPlayer.duration)}`;
            }
        });


        // Кнопка Плей
        playButton.addEventListener('click', function() {
            if (audioPlayer.paused && audioPlayer.src) {
                audioPlayer.play();
            } else if (audioPlayer.paused && !audioPlayer.src && playlist.children.length > 0) {
                const visibleTracks = Array.from(playlist.children).filter(li => li.style.display !== 'none');
                if (visibleTracks.length > 0) {
                    playTrack(visibleTracks[0]);
                }
            }
        });

        // Кнопка Пауза
        pauseButton.addEventListener('click', function() {
            audioPlayer.pause();
        });

        // Стоп
        stopButton.addEventListener('click', function() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0; 
            seekBar.value = 0; 
            timeIndicator.textContent = `0:00 / ${formatTime(audioPlayer.duration || 0)}`;
        });

        // Предыдущий трек
        prevButton.addEventListener('click', playPreviousTrack);

        // Следующий трек
        nextButton.addEventListener('click', playNextTrack);
        
        // Shuffle
        shuffleButton.addEventListener('click', function() {
            isShuffling = !isShuffling;
            
            if (isShuffling) {
                shuffleButton.classList.add('active');
            } else {
                shuffleButton.classList.remove('active');
            }
        });
        
        // Обработчик изменения скорости
        speedControl.addEventListener('input', function() {
            const speed = parseFloat(this.value);
            audioPlayer.playbackRate = speed;
            speedValue.textContent = `${speed.toFixed(2)}x`;
        });
        
        // Обработчик изменения громкости
        volumeControl.addEventListener('input', function() {
            const volume = parseFloat(this.value);
            audioPlayer.volume = volume;
            volumeValue.textContent = `${Math.round(volume * 100)}%`;
        });
        
    </script>

</body>
</html>
